name: Update grill docs

# Regenerates docs/SUPPORTED_GRILLS.md whenever the pytboss dependency
# version changes in requirements.txt.
#
# SECURITY: earlier this ran on pull_request_target and checked out the
# PR's head ref with a write-scoped token so it could push the
# regenerated doc back onto that PR branch. CodeQL flagged that as
# "Checkout of untrusted code in a privileged context" (alert #20) even
# with an actor == dependabot[bot] gate, since a privileged workflow
# checking out any externally-influenced ref is considered risky
# regardless of the gate. Triggering on push to main instead sidesteps
# the problem entirely: this workflow only ever checks out code that has
# already been merged (via the Dependabot PR + auto-merge.yml), so there
# is nothing "untrusted" being checked out in a privileged context.

on:
  push:
    branches: [main]
    paths:
      - requirements.txt
  # Lets the docs be brought up to date without waiting for a version bump,
  # and gives the push a way to be exercised: it only ever ran once before,
  # found nothing to commit, and so never revealed that the Main ruleset
  # rejects it.
  workflow_dispatch:

# The push below is made with a deploy key, not GITHUB_TOKEN, so the token
# itself needs no write access.
permissions:
  contents: read

jobs:
  update-grill-docs:
    runs-on: ubuntu-latest
    # Pushing to main means bypassing the Main ruleset. That bypass is granted
    # to deploy keys rather than to the Actions app, so no workflow's
    # GITHUB_TOKEN can reach main. It is not per-key -- the rulesets API takes
    # a null actor_id for actor_type DeployKey -- so any write-enabled deploy
    # key added to this repo later inherits it. That is still far narrower than
    # the app bypass, which every workflow acquires just by running, whereas a
    # deploy key has to be added deliberately by an admin.
    #
    # The key's private half is an environment secret and this environment is
    # restricted to main, so a workflow on any other branch cannot read it.
    environment: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # Need the previous commit to diff requirements.txt.
          # Clones over SSH with the deploy key, so the push at the end is
          # authenticated as the key. Unlike GITHUB_TOKEN, a deploy key push
          # does trigger workflows -- harmless here, because the commit only
          # touches docs/ and the push trigger above filters on
          # requirements.txt, so this cannot re-fire itself.
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}

      - name: 🔍 Check whether pytboss version changed
        id: check
        run: |
          # A manual run has no version bump to diff against, and is only ever
          # started because someone wants the docs regenerated, so take it at
          # its word.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff HEAD^ HEAD -- requirements.txt | grep -q '^[+-]pytboss=='; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.check.outputs.changed == 'true'
        with:
          python-version-file: '.python-version'

      - name: 📦 Install dependencies
        if: steps.check.outputs.changed == 'true'
        run: |
          python -m pip install uv
          uv venv
          . .venv/bin/activate
          uv pip install -r requirements.txt

      - name: 📝 Regenerate docs/SUPPORTED_GRILLS.md
        if: steps.check.outputs.changed == 'true'
        run: |
          . .venv/bin/activate
          python3 -m scripts.generate_grill_docs

      - name: ⬆️ Commit and push changes
        if: steps.check.outputs.changed == 'true'
        run: |
          if git diff --quiet -- docs/SUPPORTED_GRILLS.md; then
            echo "No changes to docs/SUPPORTED_GRILLS.md"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/SUPPORTED_GRILLS.md
          git commit -m "docs: regenerate SUPPORTED_GRILLS.md for pytboss version bump"
          git push
