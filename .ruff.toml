# Ruff configuration.
#
# This repo keeps per-tool config in its own file -- see mypy.ini and
# pytest.ini -- and has no pyproject.toml. Adding one only to hold these two
# settings would also make uv treat the repo as a buildable project, which it
# is not.
#
# `line-length` is what `ruff format` wraps to, so CI and a local run have to
# agree on it.
#
# `target-version` is the OLDEST Python this integration has to run on, which
# is not necessarily the one it is developed and tested on. hacs.json admits
# Home Assistant 2026.9.0, which itself requires Python 3.14.2, so the floor
# and CI (which reads .python-version) now agree.
#
# It is left at py312 anyway. Raising it buys nothing -- no module here needs
# syntax newer than 3.12 -- while it is the single change that reopens the
# hazard below, and it would have to be lowered again the moment hacs.json
# admits an older Home Assistant.
#
# Set to 3.14 this was actively dangerous rather than merely imprecise:
# `ruff format` rewrote `except (A, B):` into PEP 758's `except A, B:`, which
# is a SyntaxError before 3.14. A formatter run could therefore produce a
# module that fails to import for most users while every check stayed green,
# and a config_flow that cannot import breaks setup for every protocol. This
# nearly shipped once -- see #371.
line-length    = 88
target-version = "py312"

# Deliberately no `[lint] select`: ruff 0.16's default rule set is much wider
# than the `E4, E7, E9, F` the docs describe -- it includes BLE, B, S and
# ASYNC among others, which is why `# noqa: BLE001` appears in this tree at
# all. Naming a narrower set here would silently switch rules off.
